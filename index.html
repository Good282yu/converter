<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍗蝦皮優惠</title>
    <meta property="og:title" content="🍗蝦皮優惠｜專屬連結轉換器">
    <meta property="og:description" content="貼上蝦皮商品網址，一鍵升級為專屬優惠連結，搭配專屬折價券省更多！">
    <style>
        :root {
            --bg-dark: #121316;
            --card-bg: #1E2025;
            --gold-primary: #F5A623;
            --gold-gradient: linear-gradient(135deg, #FF9900 0%, #F5A623 50%, #FFD066 100%);
            --text-main: #FFFFFF;
            --text-sub: #9EA3B0;
            --line-green: #06C755;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 460px; background: var(--card-bg); border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.08); }
        .badge { display: inline-block; background: rgba(245, 166, 35, 0.15); color: var(--gold-primary); padding: 6px 14px; border-radius: 50px; font-size: 13px; font-weight: 700; margin-bottom: 12px; border: 1px solid rgba(245, 166, 35, 0.3); }
        h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-sub); font-size: 14px; margin-bottom: 18px; line-height: 1.5; }
        
        .warn-box { background: rgba(245, 166, 35, 0.12); border: 1px solid rgba(245, 166, 35, 0.35); color: #FFD066; padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 18px; text-align: center; }

        .copy-code-btn { background: rgba(245, 166, 35, 0.2); color: var(--gold-primary); border: none; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .copy-code-btn:active { transform: scale(0.95); }

        /* 輸入區塊 */
        .input-label { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; color: #E2E5EC; }
        textarea { width: 100%; height: 130px; background: #15171B; border: 1.5px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 14px; color: #FFF; font-size: 14px; resize: none; outline: none; transition: 0.2s; margin-bottom: 18px; line-height: 1.5; }
        textarea:focus { border-color: var(--gold-primary); }
        textarea::placeholder { color: #5B606D; }

        /* 按鈕群組 */
        .btn-group { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 14px; }
        .btn { border: none; border-radius: 14px; padding: 15px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px; text-decoration: none; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--gold-gradient); color: #121316; box-shadow: 0 6px 20px rgba(245, 166, 35, 0.25); }
        .btn-clear { background: #2A2D35; color: var(--text-sub); }
        .btn-line { width: 100%; background: var(--line-green); color: #FFF; margin-top: 6px; }

        /* 結果顯示區 */
        #resultArea { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); }
        .result-item { background: #15171B; padding: 12px 14px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,0.06); }
        .result-link { color: var(--gold-primary); font-size: 13px; word-break: break-all; text-decoration: none; flex: 1; font-weight: 600; }
        .toast { position: fixed; bottom: 30px; background: #FFF; color: #121316; padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 14px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 999; }
    </style>
</head>
<body>

<div class="container">
    <div class="badge">蝦皮優惠</div>
    <h1>🍗蝦皮優惠</h1>
    <p class="subtitle">貼上蝦皮商品網址，一鍵升級為專屬優惠連結，自動跳轉蝦皮 App 套用推廣折價券！</p>

    <div class="warn-box">💡 提醒：請使用 Safari / Chrome 等外部瀏覽器開啟，才能順利跳轉蝦皮 App 領券喔！</div>

    <div class="input-label">
        <span>貼上商品連結（每行一個，最多 5 個）</span>
    </div>
    <textarea id="inputUrls" placeholder="請貼上蝦皮商品網址...&#10;例如：https://shopee.tw/product/..."></textarea>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="convertLinks()">⚡ 立即轉換優惠連結</button>
        <button class="btn btn-clear" onclick="clearInput()">清除</button>
    </div>

    <a href="https://s.shopee.tw/7pul3poH36" target="_blank" class="btn btn-line" id="lineBtn">
        🔥 前往今日精選優惠
    </a>

    <div id="resultArea">
        <div class="input-label"><span>🎉 轉換成功！請點擊前往蝦皮 App 領券：</span></div>
        <div id="resultList"></div>
    </div>
</div>

<div class="toast" id="toast">已複製到剪貼簿！</div>

<script>
    const AFFILIATE_ID = "16315590014";
    const PROMO_CODE = "AEL-XSJ-LSD";

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    function clearInput() {
        document.getElementById('inputUrls').value = '';
        document.getElementById('resultArea').style.display = 'none';
    }

    function toShopeeUniversalLink(rawUrl) {
        let cleanUrl = rawUrl.split('?')[0];
        
        // 嘗試把中文字的商品網址轉為標準 /product/賣場ID/商品ID 格式，提高 App 領券觸發率
        const matchDot = cleanUrl.match(/-i\.(\d+)\.(\d+)/);
        if (matchDot) {
            cleanUrl = `https://shopee.tw/product/${matchDot[1]}/${matchDot[2]}`;
        }

        // 轉換為蝦皮 Universal Link 深度喚醒格式
        let ulBase = cleanUrl.replace("https://shopee.tw/", "https://shopee.tw/universal-link/");
        
        const trackParams = `utm_source=an_${AFFILIATE_ID}&utm_medium=affiliates&utm_campaign=-&utm_content=${PROMO_CODE}&mmp_pid=an_${AFFILIATE_ID}&uls_trackid=51869880001`;
        const deepLinkTarget = encodeURIComponent(`${cleanUrl}?${trackParams}`);
        
        return `${ulBase}?deep_and_deferred=1&${trackParams}&smtt=9&deep_link_value=${deepLinkTarget}`;
    }

    function convertLinks() {
        const raw = document.getElementById('inputUrls').value.trim();
        if (!raw) {
            showToast("⚠️ 請先貼上蝦皮商品連結喔！");
            return;
        }
        const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length > 0).slice(0, 5);
        const resultList = document.getElementById('resultList');
        resultList.innerHTML = '';

        lines.forEach((line, idx) => {
            const urlMatch = line.match(/https?:\/\/[^\s]+/);
            if (urlMatch) {
                let finalUrl = toShopeeUniversalLink(urlMatch[0]);

                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <a href="${finalUrl}" target="_blank" class="result-link">👉 點此打開蝦皮領券 (商品 ${idx + 1})</a>
                    <button class="copy-code-btn" onclick="navigator.clipboard.writeText('${finalUrl}'); showToast('✅ 已複製優惠連結！')">複製連結</button>
                `;
                resultList.appendChild(div);
            }
        });

        if (resultList.children.length > 0) {
            document.getElementById('resultArea').style.display = 'block';
        } else {
            showToast("⚠️ 找不到有效的網址，請確認格式！");
        }
    }
</script>

</body>
</html>
